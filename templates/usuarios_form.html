{% extends "base.html" %}
{% block title %}{{ 'Editar Usuario' if usuario else 'Nuevo Usuario' }}{% endblock %}

{% block content %}
<div class="container d-flex justify-content-center py-5">
    <div class="card shadow p-4" style="width: 100%; max-width: 500px;">
        <div class="card-header bg-white border-0">
            <h2 class="h4 text-dark mb-0">
                <i class="bi bi-person-{{ 'gear' if usuario else 'plus' }} me-2"></i> 
                {{ 'Editar Usuario' if usuario else 'Agregar Usuario' }}
            </h2>
        </div>
        
        <div class="card-body pt-0">
            <form method="POST" action="{{ url_for('edit_usuario', id_usuario=usuario.id_usuario) if usuario else url_for('add_usuario') }}">
                
                <div class="mb-3">
                    <label for="nombre" class="form-label">Nombre:</label>
                    <input type="text" class="form-control" id="nombre" name="nombre" 
                           value="{{ usuario.nombre if usuario else '' }}" placeholder="Nombre completo" required>
                </div>
                
                <div class="mb-3">
                    <label for="email" class="form-label">Email:</label>
                    <input type="email" class="form-control" id="email" name="email" 
                           value="{{ usuario.email if usuario else '' }}" placeholder="correo@ejemplo.com" required>
                </div>
                
                <div class="mb-4">
                    <label for="password" class="form-label">Contraseña: 
                        {% if usuario %}
                            <small class="text-muted">(Dejar vacío para no cambiar)</small>
                        {% else %}
                            <small class="text-danger">*Requerido para nuevo usuario</small>
                        {% endif %}
                    </label>
                    <input type="password" class="form-control" id="password" name="password" placeholder="********" autocomplete="new-password" 
                           {% if not usuario %} required {% endif %}>
                </div>
                
                <div class="d-flex justify-content-between">
                    <a href="{{ url_for('list_usuarios') }}" class="btn btn-secondary"><i class="bi bi-x-circle"></i> Cancelar</a>
                    <button type="submit" class="btn btn-primary">
                        <i class="bi bi-save"></i> {{ 'Actualizar' if usuario else 'Guardar' }}
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
