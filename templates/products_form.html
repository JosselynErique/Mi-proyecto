{% extends "base.html" %}
{% block content %}
<div class="container card p-4">
  <h3>{{ 'Editar' if producto else 'Agregar' }} producto</h3>
  <form method="POST">
    <div class="mb-3">
      <label class="form-label">Nombre</label>
      <input name="nombre" class="form-control" value="{{ producto.nombre if producto else '' }}" required>
    </div>
    <div class="mb-3">
      <label class="form-label">Cantidad</label>
      <input type="number" name="cantidad" class="form-control" value="{{ producto.cantidad if producto else 0 }}" min="0" required>
    </div>
    <div class="mb-3">
      <label class="form-label">Precio</label>
      <input type="number" step="0.01" name="precio" class="form-control" value="{{ producto.precio if producto else 0.00 }}" required>
    </div>
    <div class="mb-3 row">
      <div class="col">
        <label class="form-label">Categoría</label>
        <select name="categoria_id" class="form-select">
          <option value="">-- Sin categoría --</option>
          {% for c in categorias %}
          <option value="{{ c.id }}" {% if producto and producto.categoria_id==c.id %}selected{% endif %}>{{ c.nombre }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="col">
        <label class="form-label">Proveedor</label>
        <select name="proveedor_id" class="form-select">
          <option value="">-- Sin proveedor --</option>
          {% for prov in proveedores %}
          <option value="{{ prov.id }}" {% if producto and producto.proveedor_id==prov.id %}selected{% endif %}>{{ prov.nombre }}</option>
          {% endfor %}
        </select>
      </div>
    </div>

    <button **type="submit"** class="btn btn-primary">{{ 'Actualizar' if producto else 'Agregar' }}</button>
    <a href="{{ url_for('list_products') }}" class="btn btn-secondary">Volver</a>
  </form>
</div>
{% endblock %}
