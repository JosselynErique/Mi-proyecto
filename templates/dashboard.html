{% extends "base.html" %}
{% block content %}
<div class="text-center contenido-dashboard">
    <h2 class="mb-3">✨ Bienvenido, {{ current_user.nombre }} ✨</h2>
    <p class="text-light">Nos alegra verte de nuevo. Aquí encontrarás tu panel de control.</p>

    <div class="d-flex justify-content-center gap-3 mt-4">
        <a href="{{ url_for('list_products') }}" class="btn btn-primary btn-lg">
            <i class="bi bi-box-seam"></i> Mis productos
        </a>
        <a href="{{ url_for('list_usuarios') }}" class="btn btn-success btn-lg">
            <i class="bi bi-people-fill"></i> Usuarios
        </a>
        <a href="{{ url_for('logout') }}" class="btn btn-danger btn-lg">
            <i class="bi bi-box-arrow-right"></i> Cerrar sesión
        </a>
    </div>
</div>
{% endblock %}
