{% extends "base.html" %}

{% block content %}
<div class="container">
    <h2><i class="bi bi-cart-fill"></i> Lista de Productos</h2>
    <a href="{{ url_for('add_product') }}" class="btn"><i class="bi bi-plus-circle-fill"></i> Agregar Producto</a>

    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Nombre</th>
                <th>Cantidad</th>
                <th>Precio</th>
                <th>Acciones</th>
            </tr>
        </thead>
        <tbody>
            {% for p in productos %}
            <tr>
                <td>{{ p.id_producto }}</td>
                <td>{{ p.nombre }}</td>
                <td>{{ p.cantidad }}</td>
                <td>${{ "%.2f"|format(p.precio) }}</td>
                <td>
                    <a href="{{ url_for('edit_product', id_producto=p.id_producto) }}" class="action-btn edit"><i class="bi bi-pencil-fill"></i> Editar</a>
                    <a href="{{ url_for('delete_product', id_producto=p.id_producto) }}" class="action-btn delete" onclick="return confirm('¿Seguro que deseas eliminar este producto?')"><i class="bi bi-trash-fill"></i> Eliminar</a>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
