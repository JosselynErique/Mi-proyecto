{% extends "base.html" %}
{% block title %}Registrar Nueva Venta{% endblock %}

{% block content %}
<div class="container py-4">
    <div class="card shadow mb-4">
        <div class="card-header bg-white py-3">
            <h2 class="h4 text-dark m-0"><i class="bi bi-bag-plus-fill me-2"></i> Registrar Nueva Venta</h2>
        </div>
        
        <div class="card-body">
            
            <div class="mb-4">
                <label for="search-product" class="form-label">Buscar y Agregar Producto:</label>
                <div class="input-group">
                    <input type="text" class="form-control" id="search-product" placeholder="Buscar por nombre..." autocomplete="off">
                    <span class="input-group-text"><i class="bi bi-search"></i></span>
                </div>
                <div id="search-results" class="list-group position-absolute w-auto shadow" style="z-index: 100; max-width: 400px;">
                    </div>
            </div>

            <form method="POST" action="{{ url_for('nueva_venta') }}" id="venta-form">
                
                <h3 class="h5 mt-4 mb-3">Detalle de la Venta</h3>
                <div class="table-responsive">
                    <table class="table table-striped table-bordered">
                        <thead class="table-info">
                            <tr>
                                <th>Producto</th>
                                <th style="width: 15%">Precio Unit.</th>
                                <th style="width: 10%">Cant.</th>
                                <th style="width: 15%">Subtotal</th>
                                <th style="width: 5%"></th>
                            </tr>
                        </thead>
                        <tbody id="detalle-venta">
                            <tr id="empty-row">
                                <td colspan="5" class="text-center text-muted">Agrega productos para iniciar la venta.</td>
                            </tr>
                        </tbody>
                        <tfoot>
                            <tr>
                                <td colspan="3" class="text-end fw-bold">TOTAL VENTA:</td>
                                <td colspan="1" class="fw-bold" id="total-venta-display">S/ 0.00</td>
                                <td></td>
                            </tr>
                        </tfoot>
                    </table>
                </div>
                
                <input type="hidden" name="total_venta" id="total-venta-input" value="0.00">

                <div class="d-grid mt-4">
                    <button type="submit" class="btn btn-success btn-lg" id="registrar-btn" disabled>
                        <i class="bi bi-check-circle-fill"></i> Registrar Venta
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script>
    // URL de la API de búsqueda definida en Flask
    const API_SEARCH_URL = "{{ url_for('api_search_products') }}";

    // Diccionario para rastrear productos en la tabla (clave: id, valor: precio)
    let carrito = {};

    function updateCalculations() {
        let total = 0;
        let itemCount = 0;
        
        // Iterar sobre las filas de la tabla (excluyendo la fila vacía)
        $('#detalle-venta tr').each(function() {
            if ($(this).attr('id') !== 'empty-row') {
                const subtotalText = $(this).find('td').eq(3).text().replace('S/ ', '').trim();
                total += parseFloat(subtotalText);
                itemCount++;
            }
        });

        // Actualizar el total y habilitar/deshabilitar el botón
        $('#total-venta-display').text('S/ ' + total.toFixed(2));
        $('#total-venta-input').val(total.toFixed(2));
        
        if (itemCount > 0) {
            $('#empty-row').hide();
            $('#registrar-btn').prop('disabled', false);
        } else {
            $('#empty-row').show();
            $('#registrar-btn').prop('disabled', true);
        }
    }

    function addProductToCart(product) {
        // Verificar si el producto ya está en el carrito
        if (carrito[product.id]) {
            // Si ya está, solo incrementar la cantidad si el stock lo permite
            const input = $(`#cant-${product.id}`);
            let newQty = parseInt(input.val()) + 1;
            
            if (newQty <= parseInt(product.cantidad)) {
                 input.val(newQty).trigger('change');
            } else {
                alert(`Stock máximo alcanzado para ${product.nombre}. Disponible: ${product.cantidad}`);
            }
            return;
        }

        // 1. Ocultar la fila de "sin productos"
        $('#empty-row').hide();

        // 2. Crear la fila del producto
        const newRow = `
            <tr id="row-${product.id}">
                <td>${product.nombre}
                    <input type="hidden" name="product_id[]" value="${product.id}">
                </td>
                <td>S/ ${parseFloat(product.precio).toFixed(2)}</td>
                <td>
                    <input type="number" id="cant-${product.id}" name="cantidad[]" 
                           class="form-control form-control-sm text-center quantity-input" 
                           value="1" min="1" max="${product.cantidad}" data-precio="${product.precio}" data-id="${product.id}" required>
                </td>
                <td class="subtotal-cell">S/ ${parseFloat(product.precio).toFixed(2)}</td>
                <td>
                    <button type="button" class="btn btn-danger btn-sm remove-item" data-id="${product.id}">
                        <i class="bi bi-x-lg"></i>
                    </button>
                </td>
            </tr>
        `;
        $('#detalle-venta').append(newRow);

        // 3. Agregar al diccionario de seguimiento
        carrito[product.id] = parseFloat(product.precio);
        
        // 4. Actualizar cálculos
        updateCalculations();
    }

    // --- MANEJO DE EVENTOS ---
    
    // 1. Búsqueda con AJAX
    $('#search-product').on('keyup', function() {
        const query = $(this).val().trim();
        const resultsDiv = $('#search-results');
        
        resultsDiv.empty();
        if (query.length < 2) {
            return;
        }
        
        $.getJSON(API_SEARCH_URL, { q: query }, function(data) {
            data.forEach(function(product) {
                // Solo mostrar productos con stock
                if (parseInt(product.cantidad) > 0) {
                     const item = $(`<button type="button" class="list-group-item list-group-item-action">
                                        ${product.nombre} <span class="badge bg-secondary">${product.cantidad} en stock</span>
                                    </button>`);
                    // Guardar los datos del producto en el elemento para fácil acceso
                    item.data('product', product); 
                    resultsDiv.append(item);
                }
            });
        });
    });

    // 2. Click para agregar producto desde la búsqueda
    $('#search-results').on('click', '.list-group-item', function() {
        const productData = $(this).data('product');
        addProductToCart(productData);
        
        // Limpiar el buscador y resultados
        $('#search-product').val('');
        $('#search-results').empty();
    });

    // 3. Cambio de cantidad (Recálculo)
    $('#detalle-venta').on('change', '.quantity-input', function() {
        const input = $(this);
        const qty = parseInt(input.val());
        const price = parseFloat(input.data('precio'));
        const row = input.closest('tr');
        
        if (qty < 1 || isNaN(qty)) {
            input.val(1).trigger('change'); // Asegurar un mínimo
            return;
        }

        const subtotal = qty * price;
        row.find('.subtotal-cell').text('S/ ' + subtotal.toFixed(2));
        updateCalculations();
    });

    // 4. Eliminar elemento
    $('#detalle-venta').on('click', '.remove-item', function() {
        const productId = $(this).data('id');
        delete carrito[productId]; // Eliminar del diccionario de seguimiento
        $(`#row-${productId}`).remove(); // Eliminar la fila
        updateCalculations();
    });

    // Inicializar el cálculo al cargar la página
    $(document).ready(function() {
        updateCalculations();
    });
</script>
{% endblock %}
